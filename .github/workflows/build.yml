name: Build APK
on: [push, workflow_dispatch]

env:
  GRADLE_OPTS: "-Xmx3g -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=2"
  JAVA_TOOL_OPTIONS: "-Xmx3g"
  ORG_GRADLE_DAEMON: "false"

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Android SDK (manual)
        run: |
          SDK_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          TMP_ZIP="/tmp/cmdline-tools.zip"
          echo "Downloading cmdline-tools..."
          curl -fsSL "$SDK_URL" -o "$TMP_ZIP"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          unzip -q "$TMP_ZIP" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          rm "$TMP_ZIP"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: Generate Gradle Wrapper (关键新增步骤)
        run: gradle wrapper --gradle-version 8.5 --distribution-type all

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx3g" \
            -Dorg.gradle.workers.max=2 \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
